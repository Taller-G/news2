services:
  postgres:
    image: postgres:16-alpine
    container_name: funfacts-postgres
    environment:
      POSTGRES_USER: funfacts
      POSTGRES_PASSWORD: funfacts
      POSTGRES_DB: funfacts
    ports:
      - "5434:5432"
    volumes:
      - funfacts_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funfacts -d funfacts"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  funfacts_pgdata:
